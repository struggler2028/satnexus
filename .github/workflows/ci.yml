name: SatNexus CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test & Quality Gate (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite with Coverage
        run: |
          cd backend
          python -m pytest tests -v --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend-build:
    name: Frontend Test & Production Build (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: TypeScript Static Type Checking
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Frontend Vitest Component Suite
        run: |
          cd frontend
          npm test

      - name: Production Vite Build
        run: |
          cd frontend
          npm run build
